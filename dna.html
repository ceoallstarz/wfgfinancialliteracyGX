<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership DNA Profile — Hyperion Legacy Builders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a2a42;
  --navy-deep:#111d2e;
  --gold:#c9a84c;
  --gold-soft:#e2cd91;
  --cream:#faf7f0;
  --cream-deep:#f1ebdd;
  --line:#ddd3c0;
  --ink:#1a2a42;
  --muted:#6a7788;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
.wrap{max-width:640px;margin:0 auto;padding:0 22px;min-height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
.counter{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rail{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.rail-fill{height:100%;width:0;background:var(--gold);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- screens ---------- */
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 0 24px}
.screen{display:none;animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
h2{font-size:clamp(21px,5vw,27px);line-height:1.25;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.lede{font-size:16px;color:var(--muted);margin-bottom:22px}
.note{font-size:14px;color:var(--muted);margin-bottom:20px}
.hint{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:18px}

/* promise card — the trust contract */
.promise{
  border:1px solid var(--line);
  border-left:3px solid var(--gold);
  background:var(--cream-deep);
  border-radius:var(--radius);
  padding:20px 20px 6px;
  margin:24px 0 28px;
}
.promise dt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:5px}
.promise dd{font-size:15px;color:#41505f;margin-bottom:16px}

/* ---------- inputs ---------- */
.field{margin-bottom:16px}
label.flabel{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  transition:border-color .18s,box-shadow .18s;
}
textarea{min-height:130px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.18)}

.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.opt{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;
  font-size:15.5px;transition:border-color .16s,background .16s;
}
.opt:hover{border-color:var(--gold-soft)}
.opt input{position:absolute;opacity:0;width:0;height:0}
.dot{width:18px;height:18px;flex:none;border:1.5px solid #c3b795;border-radius:50%;position:relative;transition:border-color .16s}
.opt.sq .dot{border-radius:5px}
.opt.sel{border-color:var(--gold);background:#fdfaf1}
.opt.sel .dot{border-color:var(--gold);background:var(--gold)}
.opt.sel .dot::after{
  content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.opt.max{opacity:.4;pointer-events:none}
.pick-count{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

/* echoed answer in the why-ladder */
.echo{
  border-left:3px solid var(--gold);
  background:var(--cream-deep);
  border-radius:0 10px 10px 0;
  padding:12px 16px;margin-bottom:18px;
  font-size:15px;color:#41505f;font-style:italic;
  max-height:150px;overflow:auto;
}
.echo::before{content:"You said: ";font-style:normal;font-weight:700;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}

/* ranking rows */
.rankrow{align-items:flex-start;gap:14px}
.numb{
  width:26px;height:26px;flex:none;border-radius:50%;
  border:1.5px solid #c3b795;background:#fff;
  font-size:13px;font-weight:800;color:var(--navy);
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.rankrow.sel .numb{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.rtxt b{display:block;font-weight:700;font-size:15.5px}
.rtxt em{display:block;font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.btn{
  background:var(--navy);color:#fff;font-size:15px;font-weight:600;
  padding:14px 30px;border-radius:10px;transition:background .18s,transform .12s;
}
.btn:hover{background:var(--navy-deep)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:#b8973f}
.skip{
  font-size:14px;font-weight:600;color:var(--muted);
  padding:10px 4px;border-bottom:1px solid var(--line);border-radius:0;
}
.skip:hover{color:var(--navy);border-color:var(--gold)}
.back{font-size:14px;color:var(--muted);padding:10px 4px;margin-left:auto}
.back:hover{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ---------- done ---------- */
.rings{width:96px;height:96px;margin:0 auto 26px;display:block}
.done{text-align:center}
.status{font-size:13px;color:var(--muted);margin-top:16px;min-height:20px}
.status.err{color:#a4442f}
footer{padding:18px 0 30px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a99e88;text-align:center}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 L16.5 9 H13.8 L18 15.5 H14.5 L19 21 H5 L9.5 15.5 H6 L10.2 9 H7.5 Z" fill="#1a2a42"/>
        <rect x="11" y="19" width="2" height="4" fill="#c9a84c"/>
      </svg>
      <span class="brand-name">Hyperion Legacy Builders</span>
    </div>
    <span class="counter" id="counter"></span>
  </header>
  <div class="rail"><div class="rail-fill" id="rail"></div></div>

  <main id="stage"></main>

  <footer>Rooted. Rising. Unstoppable.</footer>
</div>

<script type="module">
/* =====================================================================
   1. SET THIS
   ===================================================================== */

// Paste the SAME firebaseConfig object you used in crm.html.
const firebaseConfig = {
  apiKey: "AIzaSyC5jXI140Z9f618dFk8JwGhHyOzU6Q6Jek",
  authDomain: "hyperion-crm-ea994.firebaseapp.com",
  projectId: "hyperion-crm-ea994",
  storageBucket: "hyperion-crm-ea994.firebasestorage.app",
  messagingSenderId: "651443980689",
  appId: "1:651443980689:web:eaed1f15d21c306616b230"
};

/* Firestore rule to add (Firebase console > Firestore > Rules):

   match /teams/{team}/dnaProfiles/{id} {
     allow create: if true;                  // recruits submit without an account
     allow read, update, delete: if request.auth != null;   // only you can read
   }
*/

/* If the link is dna.html?r=ABC123, the submission attaches itself to
   that recruit's card in the CRM. Without it, it saves unattached and
   you match it by name later. */
const RECRUIT_ID = new URLSearchParams(location.search).get("r") || null;

// Must match the TEAM value in crm.html.
const TEAM = "hyperion";

/* =====================================================================
   2. THE QUESTIONS  (Pass 1 — Day 1)
   ===================================================================== */
const Q = [
  { id:"contact", type:"fields", title:"First, how to reach you.",
    fields:[
      {k:"name",  label:"Full name", t:"text", req:true},
      {k:"goesBy",label:"What you'd rather be called", t:"text"},
      {k:"phone", label:"Phone", t:"tel"},
      {k:"email", label:"Email", t:"email"},
      {k:"spouse", label:"Spouse — if applicable", t:"text"},
      {k:"bday",  label:"Birthday — month and day (optional)", t:"text", ph:"March 14"}
    ]},

  { id:"why1", group:"why", sub:1, label:"Surface Level", type:"long",
    title:"Why did you start with RFM?",
    hint:"Most people start with \u201cto make extra money.\u201d That's a fine place to start \u2014 we're going to keep going from there.",
    ph:"Say it the way you'd say it to a friend." },

  { id:"why2", group:"why", sub:2, label:"Going Deeper", type:"long", echo:"why1",
    title:() => /money|income|debt|bills|financ|pay/i.test(answers.why1 || "")
      ? "Why do you need the extra money?"
      : "Why do you need that?",
    hint:"\u201cTo pay off debt.\u201d \u201cTo help my family.\u201d That's where most people land. Still general \u2014 keep going.",
    ph:"" },

  { id:"why3", group:"why", sub:3, label:"Getting Specific", type:"long", echo:"why2",
    title:"What does that look like \u2014 specifically?",
    hint:"Names, places, numbers. \u201cHelp my family\u201d is a category. \u201cBuy my mom a house\u201d is a why.",
    ph:"My mom is struggling. I want to buy her a house." },

  { id:"why4", group:"why", sub:4, label:"Emotional Core", type:"long", echo:"why3",
    title:"What would that mean to you?",
    hint:"This is the feeling, not the plan.",
    ph:"She sacrificed everything for me. She's never had financial security." },

  { id:"why5", group:"why", sub:5, label:"The Real Why", type:"long", echo:"why4",
    title:"Picture the day it's actually done. Who's standing there with you, and what do they say?",
    hint:"Be specific. Where are you, and who's with you? Use their name. This is the one you write on your mirror.",
    ph:"My mom, on the porch of her own house, and she doesn't say anything." },

  { id:"fiveYear", type:"long", title:"If this works, what does your life look like in five years?",
    hint:"Describe a normal Tuesday, not a highlight reel.",
    ph:"Where you wake up, who's around, what you do that day…" },

  { id:"dreams", type:"multi", max:3, other:true, title:"Which of these are you actually building toward?",
    hint:"Pick your top three. Everything can't be first.",
    opts:["Time freedom","Financial freedom","Early retirement","Travel","Missions","Dream house",
          "Ranch or land","Kids' college","Adopting children","Ministry","Business ownership",
          "Legacy / generational wealth","Giving and charity","Other"] },

  { id:"incomeGoal", type:"single", title:"What monthly income are you aiming at?",
    hint:"This is a target, not a promise. It changes as you go.",
    opts:["$500","$1,000","$2,500","$5,000","$10,000","$20,000","$50,000","$100,000+","I'm not sure yet"] },

  { id:"incomeMeans", type:"long",
    title:() => {
      const g = answers.incomeGoal;
      return (g && g.startsWith("$"))
        ? `What would ${g} a month let you do that you can't do now?`
        : "What would hitting your income goal let you do that you can't do now?";
    },
    ph:"The specific thing. Not \"be comfortable.\"" },

  { id:"coachRecall", type:"long", title:"Tell me about a coach, boss, or teacher who got the best out of you.",
    hint:"What did they actually do? This tells me more than any personality test.",
    ph:"Who they were, and what they did that worked on you." },

  { id:"sixNeeds", type:"rank", title:"Put these in order — 1 is what you need most.",
    hint:"Tap them in order. There's no right answer and everybody needs all six; this is about which one you feel first.",
    opts:[
      ["Certainty",       "Knowing what's coming. Stability, a plan, no surprises."],
      ["Variety",         "New challenges. Repetition drains you."],
      ["Significance",    "Mattering. Being counted on, standing out, being respected."],
      ["Love & connection","Belonging. Doing this with people you're close to."],
      ["Growth",          "Getting better. Learning something you didn't know last month."],
      ["Contribution",    "Giving. Being useful to people beyond yourself."]
    ] },

  { id:"recognition", type:"single", title:"When you do something well, how do you want it handled?",
    opts:["Called out in front of the team","A private text or call","Something written I can keep",
          "Quietly — I'd rather you just know","Depends on the win"] },

  { id:"cadence", type:"single", title:"How often should we sit down one-on-one?",
    opts:["Weekly","Every other week","Monthly","As much as you'll give me"] },

  { id:"channel", type:"single", title:"Best way to reach you between those?",
    opts:["Call","Text","Voice memo","Email"] },

  { id:"wastedTime", type:"long", title:"What would make you feel like I wasted your time?",
    hint:"Answer this one honestly and you'll save us both six months.",
    ph:"Meetings with no point, being sold to, being ignored…" },

  { id:"neverQuit", type:"long", title:"Finish this sentence: \u201cIf I never quit, one day I will\u2026\u201d",
    ph:"Take a second with this one." }
];

/* =====================================================================
   3. ENGINE
   ===================================================================== */
const stage   = document.getElementById("stage");
const rail    = document.getElementById("rail");
const counter = document.getElementById("counter");
const answers = {};
let i = -1; // -1 = intro, Q.length = done

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  if (i === -1)        return intro();
  if (i >= Q.length)   return done();
  question(Q[i]);
}

/* the why-ladder is five screens but one question — number it that way */
const NUM = [];
let topics = 0, lastGroup = null;
Q.forEach(q => {
  if (!q.group || q.group !== lastGroup) topics++;
  lastGroup = q.group || null;
  NUM.push(topics);
});
const TOPICS = topics;

function chrome(){
  const q = Q[i];
  counter.textContent = q.sub
    ? `Q${NUM[i]} of ${TOPICS} · deeper ${q.sub} of 5`
    : `Question ${NUM[i]} of ${TOPICS}`;
  rail.style.width = ((i + 1) / Q.length * 100) + "%";
}

/* jump past the rest of the ladder */
function exitGroup(g){
  let n = i;
  while (n < Q.length && Q[n].group === g) n++;
  i = n; render();
}

/* ---- intro ---- */
function intro(){
  counter.textContent = "";
  rail.style.width = "0%";
  stage.innerHTML = `
    <section class="screen on">
      <p class="eyebrow">Leadership DNA Profile</p>
      <h1>Before we build together, I want to know how to lead you well.</h1>
      <p class="lede">Thirteen questions, about eight minutes. One of them goes deeper than you're expecting.</p>
      <dl class="promise">
        <dt>What it's for</dt>
        <dd>I read it before our one-on-ones so I'm coaching you instead of guessing.</dd>
        <dt>What it doesn't affect</dt>
        <dd>Your position, your contract, your promotion. There are no wrong answers.</dd>
        <dt>What you get</dt>
        <dd>A copy of everything you wrote, at the end.</dd>
      </dl>
      <p class="note">Skip anything you don't want to answer. That's a real option, not a polite one.</p>
      <div class="actions"><button class="btn" id="go">Start</button></div>
    </section>`;
  document.getElementById("go").onclick = () => { i = 0; render(); };
}

/* ---- a question ---- */
function question(q){
  chrome();
  let body = "";

  if (q.type === "fields"){
    body = q.fields.map(f => `
      <div class="field">
        <label class="flabel" for="f_${f.k}">${esc(f.label)}</label>
        <input id="f_${f.k}" type="${f.t}" placeholder="${esc(f.ph || "")}" value="${esc(answers[f.k] || "")}">
      </div>`).join("");
  }

  if (q.type === "long"){
    body = `<textarea id="ta" placeholder="${esc(q.ph || "")}">${esc(answers[q.id] || "")}</textarea>`;
  }

  if (q.type === "single" || q.type === "multi"){
    const cur = answers[q.id] || (q.type === "multi" ? [] : "");
    const sq  = q.type === "multi" ? " sq" : "";
    body = (q.type === "multi" ? `<p class="pick-count" id="pc"></p>` : "") +
      `<div class="opts">` + q.opts.map((o,n) => {
        const on = q.type === "multi" ? cur.includes(o) : cur === o;
        return `<label class="opt${sq}${on ? " sel" : ""}" data-v="${esc(o)}">
                  <span class="dot"></span><span>${esc(o)}</span>
                </label>`;
      }).join("") + `</div>`;
    if (q.other){
      body += `<div class="field" id="otherWrap" style="margin-top:12px;display:${cur.includes("Other") ? "block" : "none"}">
                 <label class="flabel" for="otherTxt">Tell me what "Other" is</label>
                 <input id="otherTxt" type="text" value="${esc(answers[q.id+"Other"] || "")}">
               </div>`;
    }
  }

  if (q.type === "rank"){
    const order = answers[q.id] || (answers[q.id] = []);
    body = `<p class="pick-count" id="pc"></p><div class="opts">` +
      q.opts.map(([name, desc]) => {
        const at = order.indexOf(name);
        return `<label class="opt rankrow${at > -1 ? " sel" : ""}" data-v="${esc(name)}">
                  <span class="numb">${at > -1 ? at + 1 : ""}</span>
                  <span class="rtxt"><b>${esc(name)}</b><em>${esc(desc)}</em></span>
                </label>`;
      }).join("") +
      `</div><div style="margin-top:12px">
         <button class="skip" id="resetRank">Start the order over</button>
       </div>`;
  }

  /* the ladder shows what they just said, in their words */
  let echo = "";
  if (q.echo && answers[q.echo]){
    echo = `<blockquote class="echo">${esc(answers[q.echo])}</blockquote>`;
  }

  const heading = typeof q.title === "function" ? q.title() : q.title;

  stage.innerHTML = `
    <section class="screen on">
      ${q.sub ? `<p class="eyebrow">Level ${q.sub} · ${esc(q.label)}</p>` : ""}
      ${echo}
      <h2>${esc(heading)}</h2>
      ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : `<div style="height:6px"></div>`}
      ${body}
      <div class="actions">
        <button class="btn" id="next">${i === Q.length - 1 ? "Finish" : "Next"}</button>
        <button class="skip" id="skip">Skip this</button>
        ${i > 0 ? `<button class="back" id="back">Back</button>` : ""}
      </div>
      ${q.sub && q.sub > 1 ? `<div style="margin-top:16px">
        <button class="skip" id="stopLadder">That's as deep as I want to go</button></div>` : ""}
    </section>`;

  // option clicks
  if (q.type === "single" || q.type === "multi"){
    const pc = document.getElementById("pc");
    const paint = () => {
      if (q.type !== "multi") return;
      const n = (answers[q.id] || []).length;
      pc.textContent = `${n} of ${q.max} chosen`;
      document.querySelectorAll(".opt").forEach(el =>
        el.classList.toggle("max", n >= q.max && !el.classList.contains("sel")));
      const wrap = document.getElementById("otherWrap");
      if (wrap) wrap.style.display = (answers[q.id] || []).includes("Other") ? "block" : "none";
    };
    document.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => {
        const v = el.dataset.v;
        if (q.type === "single"){
          answers[q.id] = v;
          document.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
          el.classList.add("sel");
        } else {
          const list = answers[q.id] || (answers[q.id] = []);
          const at = list.indexOf(v);
          if (at > -1) { list.splice(at,1); el.classList.remove("sel"); }
          else if (list.length < q.max) { list.push(v); el.classList.add("sel"); }
          paint();
        }
      };
      el.setAttribute("tabindex","0");
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } };
    });
    paint();
  }

  // ranking: tap in order of importance, tap again to pull it back out
  if (q.type === "rank"){
    const pc = document.getElementById("pc");
    const paint = () => {
      const order = answers[q.id];
      pc.textContent = order.length === q.opts.length
        ? "All six ranked" : `${order.length} of ${q.opts.length} placed`;
      document.querySelectorAll(".rankrow").forEach(el => {
        const at = order.indexOf(el.dataset.v);
        el.classList.toggle("sel", at > -1);
        el.querySelector(".numb").textContent = at > -1 ? at + 1 : "";
      });
    };
    document.querySelectorAll(".rankrow").forEach(el => {
      el.setAttribute("tabindex","0");
      const hit = () => {
        const order = answers[q.id], at = order.indexOf(el.dataset.v);
        if (at > -1) order.splice(at,1); else order.push(el.dataset.v);
        paint();
      };
      el.onclick = hit;
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hit(); } };
    });
    document.getElementById("resetRank").onclick = () => { answers[q.id] = []; paint(); };
    paint();
  }

  const stop = document.getElementById("stopLadder");
  if (stop) stop.onclick = () => { grab(); exitGroup(q.group); };

  const grab = () => {
    if (q.type === "fields") q.fields.forEach(f => answers[f.k] = document.getElementById("f_"+f.k).value.trim());
    if (q.type === "long")   answers[q.id] = document.getElementById("ta").value.trim();
    const ot = document.getElementById("otherTxt");
    if (ot) answers[q.id+"Other"] = ot.value.trim();
  };

  document.getElementById("next").onclick = () => { grab(); i++; render(); };
  document.getElementById("skip").onclick = () => { i++; render(); };
  const b = document.getElementById("back");
  if (b) b.onclick = () => { grab(); i--; render(); };

  const first = stage.querySelector("input,textarea");
  if (first) first.focus();
}

/* ---- done ---- */
function done(){
  counter.textContent = "Complete";
  rail.style.width = "100%";
  stage.innerHTML = `
    <section class="screen on done">
      <svg class="rings" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#ddd3c0" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="#ddd3c0" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="24" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <circle cx="50" cy="50" r="13" fill="none" stroke="#c9a84c" stroke-width="2"/>
        <circle cx="50" cy="50" r="4"  fill="#1a2a42"/>
      </svg>
      <h2>That's it${answers.goesBy ? `, ${esc(answers.goesBy)}` : (answers.name ? `, ${esc(answers.name.split(" ")[0])}` : "")}.</h2>
      <p class="lede">I'll read this before we sit down. If anything changes — and it will — tell me and we'll update it.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-gold" id="copy">Copy my answers</button>
      </div>
      <p class="status" id="status">Saving…</p>
    </section>`;

  document.getElementById("copy").onclick = e => {
    navigator.clipboard.writeText(asText());
    e.target.textContent = "Copied";
  };
  save();
}

function asText(){
  const lines = [`LEADERSHIP DNA PROFILE — ${answers.name || "(no name)"}`,
                 new Date().toLocaleDateString(), ""];
  Q.forEach(q => {
    if (q.type === "fields"){
      q.fields.forEach(f => { if (answers[f.k]) lines.push(`${f.label}: ${answers[f.k]}`); });
      lines.push("");
      return;
    }
    let a = answers[q.id];
    if (q.sub === 1) lines.push("--- THE WHY, FIVE LEVELS DOWN ---");
    if (q.type === "rank"){
      lines.push("Six human needs, ranked:");
      lines.push(!a || !a.length ? "(skipped)" : a.map((v,n) => `  ${n+1}. ${v}`).join("\n"));
      lines.push("");
      return;
    }
    if (Array.isArray(a) && answers[q.id+"Other"])
      a = a.map(v => v === "Other" ? `Other: ${answers[q.id+"Other"]}` : v);
    lines.push((q.sub ? `[Level ${q.sub} \u00b7 ${q.label}] ` : "") + (typeof q.title === "function" ? q.title() : q.title));
    lines.push(!a || !a.length ? "(skipped)" : (Array.isArray(a) ? a.join(", ") : a));
    lines.push("");
  });
  return lines.join("\n");
}

/* ---- save ---- */
async function save(){
  const st = document.getElementById("status");
  if (firebaseConfig.apiKey.includes("PASTE")){
    st.textContent = "Not connected yet — use Copy my answers.";
    return;
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, collection, addDoc, serverTimestamp } =
      await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const db = getFirestore(initializeApp(firebaseConfig));
    await addDoc(collection(db, "teams", TEAM, "dnaProfiles"), {
      ...answers, recruitId: RECRUIT_ID, pass: 1,
      submittedAt: serverTimestamp(), plainText: asText()
    });
    st.textContent = "Saved.";
  } catch(err){
    console.error(err);
    st.className = "status err";
    st.textContent = "Didn't save. Tap Copy my answers and send them over — nothing is lost.";
  }
}

render();
</script>
</body>
</html>
